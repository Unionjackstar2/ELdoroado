name: Keystore exportieren
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          echo "${{ secrets.KEYSTORE_BASE64 }}" > out/KEYSTORE_BASE64.txt
          echo "${{ secrets.KEYSTORE_PASSWORD }}" > out/KEYSTORE_PASSWORD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-export
          path: out/
          retention-days: 1
