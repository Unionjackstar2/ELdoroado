name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Neueste EVRoute-ZIP finden und entpacken
        run: |
          ZIP=""
          NEWEST=0
          while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f")
            t=${t:-0}
            if [ "$t" -ge "$NEWEST" ]; then NEWEST=$t; ZIP="$f"; fi
          done < <(find . -path ./.git -prune -o -iname 'EVRoute*.zip' -print)
          if [ -z "$ZIP" ]; then
            echo "::error::Keine EVRoute*.zip im Repository gefunden"
            exit 1
          fi
          echo "Verwende $ZIP"
          unzip -o -q "$ZIP" -d _src
          cp -r _src/EVRoute/. .
          rm -rf _src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Release-Schlüssel einrichten (falls als Secret hinterlegt)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "EVR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "EVR_KEYSTORE_PASSWORD=$KP" >> "$GITHUB_ENV"
            echo "Signiere mit Release-Schlüssel"
          else
            echo "Kein Release-Schlüssel hinterlegt, Debug-Schlüssel wird verwendet"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle assembleDebug --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk EVRoute.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EVRoute-apk
          path: EVRoute.apk

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EVRoute.apk --target "${{ github.sha }}" \
            --title "EVRoute – neuester Build" --notes "Automatisch gebaut aus ${{ github.sha }}"
